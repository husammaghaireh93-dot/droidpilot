name: Build & Verify Hardened Debug APK

on:
  push:
    branches:
      - main
      - master
      - security/**
      - ci/**
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  android-test-and-build:
    name: Unit Tests & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle Wrapper JARs
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Run JVM unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Set up Unified Signing Keystore
        id: setup-keystore
        if: env.ANDROID_SIGNING_KEYSTORE_BASE64 != ''
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_DIR="${RUNNER_TEMP}/keystore"
          mkdir -p "$KEYSTORE_DIR"
          KEYSTORE_PATH="${KEYSTORE_DIR}/droidpilot-unified.jks"
          echo "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.setup-keystore.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify Debug APK SHA-256 Checksum
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_PATH"
          sha256sum "$APK_PATH" | tee "$APK_PATH.sha256"
          {
            echo "### Debug APK SHA-256"
            echo '```'
            cat "$APK_PATH.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Debug APK and SHA-256
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: droidpilot-hardened-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error

      - name: Build Release APK (R8/ProGuard Verification)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.setup-keystore.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify Release APK SHA-256 Checksum
        run: |
          RELEASE_APK=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          test -f "$RELEASE_APK"
          sha256sum "$RELEASE_APK" | tee "${RELEASE_APK}.sha256"
          {
            echo "### Release APK SHA-256"
            echo '```'
            cat "${RELEASE_APK}.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Release APK and SHA-256
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: droidpilot-hardened-release-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/*.apk.sha256
          if-no-files-found: error

      - name: Secure Clean Keystore
        if: always()
        run: |
          KEYSTORE_DIR="${RUNNER_TEMP}/keystore"
          if [ -d "$KEYSTORE_DIR" ]; then
            rm -rf "$KEYSTORE_DIR"
            echo "Cleaned keystore directory."
          fi

  mcp-server-build:
    name: Build MCP Server TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Install dependencies and compile TypeScript
        working-directory: mcp-server
        run: |
          npm ci
          npm run build
