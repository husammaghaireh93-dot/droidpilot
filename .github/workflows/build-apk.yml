name: Build & Verify Hardened Debug APK

on:
  push:
    branches:
      - main
      - security/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-test-and-build:
    name: Unit Tests & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle Wrapper JARs
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Run JVM unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK SHA-256 Checksum
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_PATH"
          sha256sum "$APK_PATH" | tee "$APK_PATH.sha256"
          {
            echo "### Debug APK SHA-256"
            echo '```'
            cat "$APK_PATH.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Debug APK and SHA-256
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: droidpilot-hardened-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error

  mcp-server-build:
    name: Build MCP Server TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Install dependencies and compile TypeScript
        working-directory: mcp-server
        run: |
          npm ci
          npm run build
